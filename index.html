    <!--
      Fonts are self-hosted (public/fonts/fonts.css), as on the reference
      invitation: Cormorant Garamond, Poppins body and Amiri for Arabic. They are linked by a script
      after first paint (below #boot), so they never hold up the door screen.
    -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "Wedding Reception of Adhil & Shimnaz",
        "image": "https://fegno.github.io/adhil-shimnaz-reception/preview.webp?v=20261106",
        "startDate": "2026-12-09T17:00:00+05:30",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "location": {
          "@type": "Place",
          "name": "Royal Convention Centre",
          "address": "Pattambi, Palakkad, Kerala, India"
        }
      }
    </script>
    <noscript><link rel="stylesheet" href="./fonts/fonts.css" /></noscript>

  <body>
    <audio id="bg-music" src="./music/bg-music.mp3" preload="none" loop playsinline></audio>
    <script>
      ;(() => {
        const audio = document.getElementById('bg-music')
        if (!(audio instanceof HTMLAudioElement)) return

        const isMobileLike =
          navigator.maxTouchPoints > 0 ||
          matchMedia('(hover: none), (pointer: coarse)').matches

        const playFromMobileGesture = () => {
          if (!isMobileLike || !audio.paused) return cleanup()
          audio.volume = 0.32
          audio.play().then(cleanup).catch(() => {})
        }

        const cleanup = () => {
          window.removeEventListener('touchstart', playFromMobileGesture, true)
          window.removeEventListener('touchend', playFromMobileGesture, true)
          window.removeEventListener('pointerdown', playFromMobileGesture, true)
          window.removeEventListener('click', playFromMobileGesture, true)
        }

        window.addEventListener('touchstart', playFromMobileGesture, {
          capture: true,
          passive: true,
        })
        window.addEventListener('touchend', playFromMobileGesture, {
          capture: true,
          passive: true,
        })
        window.addEventListener('pointerdown', playFromMobileGesture, {
          capture: true,
          passive: true,
        })
        window.addEventListener('click', playFromMobileGesture, {
          capture: true,
          passive: true,
        })
      })()
    </script>

    <!--
      Boot shell: the real door screen, rendered to static HTML at build time
      (vite-plugins/firstPaint.ts). It paints before any JavaScript loads, and
      React mounts an identical copy over it, then main.tsx removes this one.
    -->
    <div id="boot"><!--preloader-ssr--></div>
    <script>
      window.__bootT = performance.now()
      // Web fonts are linked by main.tsx once React has taken over from this
      // shell, so the handoff repaints in the same fallback faces and isn't
      // counted as a later, larger paint.
    </script>

    <div id="root"></div>
    <noscript>
      You are cordially invited to the Wedding Reception of Adhil &amp; Shimnaz on Wednesday, 9 December 2026 at 5:00 PM, Royal Convention Centre, Pattambi. Please enable JavaScript to view the full invitation.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
